server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/catalog/ {
        proxy_pass http://catalog:3000/;
    }

    location /api/customers/ {
        proxy_pass http://customers:3000/;
    }

    location /api/orders/ {
        proxy_pass http://orders:3000/;
    }

    location /api/notifications/ {
        proxy_pass http://notifications:3000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
